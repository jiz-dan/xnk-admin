<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0A0A0A; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  /* z-index DI ATAS iframe -- iframe sendiri tampak buram/putih sampai
     dokumen di dalamnya kelar dimuat (doGet Apps Script + wrapping
     sandbox Google, memang lambat, lihat OPERATIONS.md), jadi overlay
     ini nutupin celah itu sampai onload iframe di bawah bener-bener
     nembak. */
  #wrapLoading {
    position: fixed; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center;
    background: #0A0A0A; color: rgba(255,255,255,0.55); font-size: 13px; font-weight: 600;
  }
  #wrapLoading .spinner {
    width: 22px; height: 22px; margin-right: 10px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.15); border-top-color: rgba(255,255,255,0.65);
    animation: wrapSpin 0.8s linear infinite;
  }
  @keyframes wrapSpin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<!-- ?view=admin -- Admin.html (GAS) sendiri yang tampilkan login (lock
     overlay #xnkLoginLock, dibuka lewat google.script.run, NOL
     navigasi), bukan halaman login terpisah. Itu sebabnya address bar
     tidak pindah: tidak ada form-POST/target sama sekali di jalur ini.

     ?renew=<id> -- Owner ("Perpanjang") bisa mendarat DI SINI dengan
     param ini di URL HALAMAN INI (window.open ke domain admin ini,
     lihat goToRenewal()/ADMIN_URL_, ScriptStaff.html). Query string
     GitHub Pages TIDAK otomatis diteruskan ke src iframe -- script kecil
     di bawah yang membaca location.search halaman ini sendiri dan
     menambahkannya ke src iframe SEBELUM iframe dimuat. -->
<div id="wrapLoading"><div class="spinner"></div>Memuat...</div>
<iframe
  id="gasFrame"
  allow="clipboard-write"
  title="XNK Gym OS -- Admin"
  onload="document.getElementById('wrapLoading').style.display='none'"
></iframe>
<script>
  var src = "https://script.google.com/macros/s/AKfycbyPsGZUY8C7uplUdOzQ7ejxpRlMeojonuG0FwJnJTlJa8gBUUDCQqzL7QGdeeUwN2cSag/exec?view=admin";
  var renew = new URLSearchParams(location.search).get('renew');
  if (renew) src += "&renew=" + encodeURIComponent(renew);
  document.getElementById('gasFrame').src = src;
</script>
</body>
</html>
